[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-assistant"
version = "2.1.0"
description = "AI-помощник менеджера по заявкам: MCP-сервер над JSON и агент на локальной модели"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    # Рабочее место: API на Starlette/uvicorn (уже приходят с mcp), PDF и часовые пояса.
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "python-multipart>=0.0.33,<1",
    "pypdf>=6,<7",
    # Выгрузка списка писем в PDF с кириллицей (Excel и Word собираются без библиотек).
    "fpdf2>=2.8,<3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]
# Необязательный бэкенд для тех, у кого есть авторизация Claude (--backend claude).
claude = ["claude-agent-sdk>=0.2.180,<0.3"]

[project.scripts]
process-leads = "lead_assistant.cli:main"
leads-mcp-server = "lead_assistant.server:main"
leads-doctor = "lead_assistant.doctor:main"
leads-llm = "lead_assistant.llm:main"
leads-web = "lead_assistant.web.api:main"
leads-worker = "lead_assistant.web.worker:main"
leads-backup = "lead_assistant.web.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lead_assistant = ["rules.md", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "A", "RUF"]
# RUF001-003: в проекте намеренно используется кириллица.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-builtins]
# Имя параметра `id` задано контрактом MCP-инструментов.
builtins-ignorelist = ["id"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Необязательная зависимость: без неё проект собирается и проверяется.
module = ["claude_agent_sdk", "claude_agent_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "posix: проверки, имеющие смысл только на POSIX (fsync каталога, права доступа)",
]
