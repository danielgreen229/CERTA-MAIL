# Видеокарта NVIDIA (драйвер + NVIDIA Container Toolkit / Docker Desktop с WSL2):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Модель по умолчанию — Qwen3-14B целиком на видеокарте (нужно ~11 ГБ видеопамяти).

services:
  model:
    command: ["python", "-m", "lead_assistant.llm", "fetch-model", "--model", "${LEADS_LLM_MODEL:-qwen3-14b}"]

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12110
    command:
      - --model
      - /llm/models/${LEADS_MODEL_FILE:-Qwen3-14B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LEADS_LLM_CONTEXT:-16384}"
      - --n-gpu-layers
      - "999"
      - --parallel
      - "1"
      - --jinja
      - --reasoning
      - "off"
      - --no-webui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    environment:
      LEADS_LLM_MODEL: ${LEADS_LLM_MODEL:-qwen3-14b}
